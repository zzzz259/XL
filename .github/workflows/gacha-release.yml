name: Gacha Android Release

on:
  push:
    branches: [debug]
    tags: ['gacha-v*']
    paths:
      - '.github/workflows/gacha-release.yml'
      - 'xl_gacha_android/**'
      - 'xl_gacha_web/static/**'
      - 'xl_gacha_web/data/catalog.json'
      - 'xl_gacha_web/data/update-source.json'
      - 'docs/releases/gacha-v*.md'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号留空则读取 AndroidManifest.xml；填写时必须一致'
        type: string
        required: false
      publish:
        description: '发布 GitHub Release（仅 main；不勾选则只生成 Artifact）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gacha-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version and source before loading secrets
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: |
          python -B xl_gacha_android/scripts/android_release.py metadata \
            --version "$REQUESTED_VERSION" --publish "$REQUEST_PUBLISH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare isolated Python environment and Android SDK
        run: |
          python -m venv "$RUNNER_TEMP/gacha-python"
          "$RUNNER_TEMP/gacha-python/bin/python" -m pip install Pillow==12.2.0
          echo "$RUNNER_TEMP/gacha-python/bin" >> "$GITHUB_PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify release policy and artifact helpers
        working-directory: xl_gacha_android
        run: python -B -m unittest discover -s tests -p test_release.py -v
      - name: Restore original release signing inputs
        env:
          GACHA_ANDROID_KEYSTORE_BASE64: ${{ secrets.GACHA_ANDROID_KEYSTORE_BASE64 }}
          GACHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GACHA_ANDROID_KEYSTORE_PASSWORD }}
          GACHA_BILIBILI_CLIENT_JSON: ${{ secrets.GACHA_BILIBILI_CLIENT_JSON }}
        run: python -B xl_gacha_android/scripts/android_release.py prepare --private-dir "$RUNNER_TEMP/gacha-signing"
      - name: Compile, sign with original certificate and verify APK
        env:
          GACHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GACHA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python -B xl_gacha_android/scripts/android_release.py build \
            --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" \
            --private-dir "$RUNNER_TEMP/gacha-signing" \
            --output "$RUNNER_TEMP/gacha-build" --dist "$RUNNER_TEMP/gacha-dist"
      - name: Upload verified APK, checksums and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: gacha-android-${{ steps.meta.outputs.version }}
          path: ${{ runner.temp }}/gacha-dist/*
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: python -B xl_gacha_android/scripts/android_release.py cleanup --private-dir "$RUNNER_TEMP/gacha-signing"
      - name: Build summary
        if: success()
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_commit }}
        run: |
          printf '### 星落抽卡手记 %s\n\n原正式签名校验通过；B服配置已启用。\n\n源码：`%s`\n\n发布标签：`%s`\n' "$VERSION" "$SOURCE_SHA" "$TAG" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gacha-android-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/gacha-dist
      - name: Publish dedicated Android Release without overwriting an existing version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -B xl_gacha_android/scripts/android_release.py publish --dist "$RUNNER_TEMP/gacha-dist"

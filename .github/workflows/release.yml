name: XL Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不带 v 前缀，如 2.0.0）'
        required: false
        default: '2.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source is main
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:GITHUB_REF -ne "refs/heads/main") {
              throw "Manual Release dispatch must run from main (current ref: $env:GITHUB_REF)"
            }
          } else {
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag must point to a commit reachable from main"
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK (Temurin 21, for jlink/jdeps)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Release version: $v"

      - name: Build release (prepare runtimes, stage tools, tests, pyinstaller, self-check, zip)
        shell: pwsh
        run: |
          .\xl_updata_tool\scripts\release\build-release.ps1 -Version "${{ steps.ver.outputs.version }}" -NoVenv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XL-${{ steps.ver.outputs.version }}-win-x64-portable
          path: |
            xl_updata_tool/release/*.zip
            xl_updata_tool/release/SHA256SUMS.txt
            xl_updata_tool/build/size-report.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            xl_updata_tool/release/*.zip
            xl_updata_tool/release/SHA256SUMS.txt
          generate_release_notes: true

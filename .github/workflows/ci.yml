name: XL CI

on:
  push:
    branches: [debug, test, main]
  pull_request:
    branches: [debug, test, main]
  pull_request_target:
    branches: [debug, test, main]

permissions:
  contents: read

jobs:
  gacha-shared:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl_gacha_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Android shared analysis, archives and catalog contract
        run: |
          for pattern in test_analysis.py test_archive.py test_catalog_contract.py test_catalog_updates.py test_core.py; do
            python -B -m unittest discover -s tests -p "$pattern" -v
          done
      - name: Lint client and producer
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check . ../xl_updata_server/server_app/gacha_catalog.py ../xl_updata_server/tests/test_gacha_catalog_unittest.py ../xl_updata_server/tests/test_gacha_catalog_pipeline_unittest.py --target-version py311 --no-cache
      - name: JavaScript tests and syntax
        run: |
          node --test tests/image-export.test.cjs
          for file in static/*.js; do node --check "$file"; done

  gacha-android:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl_gacha_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare official SDK layout
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test engine and SDK resolver
        run: |
          node --test tests/mobile-navigation.test.cjs tests/mobile-view-model.test.cjs tests/mobile-export.test.cjs tests/engine.test.cjs tests/tap-app-login.test.cjs
          for file in web/*.js; do node --check "$file"; done
          python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile all native sources, execute WireTest and prepare real JSON tests
        run: python -B scripts/test_native.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --output "$RUNNER_TEMP/native"
      - name: Build isolated QQ share/session regression APK
        run: python -B scripts/build_login_return_test.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --output "$RUNNER_TEMP/login-return"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run catalog contract with Android org.json
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb shell mkdir -p /data/local/tmp/xl-catalog-ci
            adb push "$RUNNER_TEMP/native/catalog-tests.jar" /data/local/tmp/xl-catalog-ci/catalog-tests.jar
            adb push "$GITHUB_WORKSPACE/xl_gacha_web/tests/fixtures/catalog-contract.json" /data/local/tmp/xl-catalog-ci/contract.json
            adb shell 'CLASSPATH=/data/local/tmp/xl-catalog-ci/catalog-tests.jar app_process /system/bin cn.starfall.gacha.local.CatalogUpdatesTest /data/local/tmp/xl-catalog-ci/state /data/local/tmp/xl-catalog-ci/contract.json'
            adb shell 'CLASSPATH=/data/local/tmp/xl-catalog-ci/catalog-tests.jar app_process /system/bin cn.starfall.gacha.local.LoginLinksTest'
            adb shell 'CLASSPATH=/data/local/tmp/xl-catalog-ci/catalog-tests.jar app_process /system/bin cn.starfall.gacha.local.LoginReturnTest'
            adb install "$RUNNER_TEMP/login-return/login-return-qa.apk"
            adb shell am instrument -w cn.starfall.gacha.returnqa/cn.starfall.gacha.local.LoginReturnIntegration | tee "$RUNNER_TEMP/login-return/separate.txt"
            python -c "from pathlib import Path; s=Path('$RUNNER_TEMP/login-return/separate.txt').read_text(); assert 'PASS 12 isolated Android' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            adb shell am instrument -w -e separateTask false cn.starfall.gacha.returnqa/cn.starfall.gacha.local.LoginReturnIntegration | tee "$RUNNER_TEMP/login-return/same.txt"
            python -c "from pathlib import Path; s=Path('$RUNNER_TEMP/login-return/same.txt').read_text(); assert 'PASS 12 isolated Android' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            adb shell am instrument -w cn.starfall.gacha.returnqa/cn.starfall.gacha.local.ImageExportIntegration | tee "$RUNNER_TEMP/login-return/images.txt"
            python -c "from pathlib import Path; s=Path('$RUNNER_TEMP/login-return/images.txt').read_text(); assert 'PASS 20 image album/share checks' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            adb shell am instrument -w cn.starfall.gacha.returnqa/cn.starfall.gacha.local.LoginFreshIntegration | tee "$RUNNER_TEMP/login-return/fresh.txt"
            python -c "from pathlib import Path; s=Path('$RUNNER_TEMP/login-return/fresh.txt').read_text(); assert 'PASS 8 fresh-login WebView checks' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            adb shell am instrument -w cn.starfall.gacha.returnqa/cn.starfall.gacha.local.TapAppIntegration | tee "$RUNNER_TEMP/login-return/tap.txt"
            adb logcat -d -s AndroidRuntime:E
            python -c "from pathlib import Path; s=Path('$RUNNER_TEMP/login-return/tap.txt').read_text(); assert 'PASS 16 TapTap App WebView/handoff checks' in s and 'tap_policy_checks=21' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            adb shell am instrument -w -e mobile true cn.starfall.gacha.returnqa/cn.starfall.gacha.local.TapAppIntegration | tee "$RUNNER_TEMP/login-return/tap-mobile.txt"
            python -c "from pathlib import Path; s=Path('$RUNNER_TEMP/login-return/tap-mobile.txt').read_text(); assert 'PASS 20 TapTap App WebView/handoff checks' in s and 'layout=phone' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            adb shell am instrument -w cn.starfall.gacha.returnqa/cn.starfall.gacha.local.MobileUiIntegration | tee "$RUNNER_TEMP/login-return/mobile-ui.txt"
            python -c "from pathlib import Path; s=Path('$RUNNER_TEMP/login-return/mobile-ui.txt').read_text(); assert 'PASS ' in s and 'mobile UI checks' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            adb uninstall cn.starfall.gacha.returnqa

  gacha-https-config:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both Nginx templates with disposable test certificate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx openssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem"
          for name in nginx-bootstrap nginx-https; do
            sed -e 's/user nginx;/user www-data;/' -e "s|/etc/letsencrypt/live/xl-gacha-ip/fullchain.pem|$RUNNER_TEMP/cert.pem|" -e "s|/etc/letsencrypt/live/xl-gacha-ip/privkey.pem|$RUNNER_TEMP/key.pem|" "xl_updata_server/deploy/https/$name.conf" > "$RUNNER_TEMP/$name.conf"
            sudo nginx -t -c "$RUNNER_TEMP/$name.conf"
          done

  branch-flow:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: Enforce forward-only branch flow
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          import os

          from xl_deploy.branch_policy import is_allowed_pull_request

          head_ref = os.environ["HEAD_REF"]
          base_ref = os.environ["BASE_REF"]
          if not is_allowed_pull_request(head_ref, base_ref):
              print(f"Rejected PR flow {head_ref} -> {base_ref}.")
              raise SystemExit(1)
          print(f"Allowed PR flow: {head_ref} -> {base_ref}")
          PY

  branch-lineage:
    if: github.event_name == 'push' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify staged branch ancestry
        run: |
          git merge-base --is-ancestor origin/main origin/test || {
            echo "main must be an ancestor of test" >&2
            exit 1
          }
          git merge-base --is-ancestor origin/test origin/debug || {
            echo "test must be an ancestor of debug" >&2
            exit 1
          }
          echo "Branch lineage is valid: main <= test <= debug"

  desktop-tool:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: xl_updata_tool
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            xl_updata_tool/requirements.txt
            xl_updata_tool/requirements-dev.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: .\.venv\Scripts\python.exe -B -c "import pathlib; files=list(pathlib.Path('app').rglob('*.py')) + list(pathlib.Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'Compiled {len(files)} files')"

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Lint tests and application modules
        run: .\.venv\Scripts\python.exe -m ruff check tests app

  update-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl_updata_server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xl_updata_server/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: xl_updata_server/renderer/package-lock.json

      - name: Install renderer dependencies
        run: npm ci --prefix renderer --omit=dev --no-audit --no-fund

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q server_app run_server.py

      - name: Run tests
        run: .venv/bin/python -m pytest -q

  qq-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl_qqbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xl_qqbot/requirements.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q bot_app

      - name: Run tests
        run: .venv/bin/python -m pytest -q

  deploy-controller:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and lint tools
        run: python -m pip install pytest ruff==0.17.1

      - name: Compile deployment controller sources
        run: python -B -c "import pathlib; files=list(pathlib.Path('xl_deploy').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'Compiled {len(files)} files')"

      - name: Run deployment controller tests
        run: python -m pytest -q xl_deploy/tests --basetemp=${{ runner.temp }}/xl-deploy-pytest -p no:cacheprovider

      - name: Lint deployment controller
        run: python -m ruff check xl_deploy --target-version py311

name: XL CI

on:
  push:
    branches: [debug, test, main]
  pull_request:
    branches: [debug, test, main]

jobs:
  desktop-tool:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: xl_updata_tool
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            xl_updata_tool/requirements.txt
            xl_updata_tool/requirements-dev.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: .\.venv\Scripts\python.exe -B -c "import pathlib; files=list(pathlib.Path('app').rglob('*.py')) + list(pathlib.Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'Compiled {len(files)} files')"

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Lint tests and application modules
        run: .\.venv\Scripts\python.exe -m ruff check tests app

  update-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl_updata_server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xl_updata_server/requirements.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q server_app run_server.py

      - name: Run tests
        run: .venv/bin/python -m pytest -q

  qq-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl_qqbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xl_qqbot/requirements.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q bot_app

      - name: Run tests
        run: .venv/bin/python -m pytest -q

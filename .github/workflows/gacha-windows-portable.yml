name: Build Windows portable app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: xl_gacha_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install 'pyinstaller>=6.12,<7'
      - run: .venv/Scripts/python.exe -B scripts/build_portable.py --output output
      - uses: actions/upload-artifact@v4
        with:
          name: StarfallGacha-Windows-x64
          path: xl_gacha_web/output/*.zip
          if-no-files-found: error
          retention-days: 14

user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server {
        listen 80 default_server;
        server_name 8.134.186.234;
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/xl-gacha-acme;
            autoindex off;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
    server {
        listen 443 ssl default_server;
        server_name 8.134.186.234;
        ssl_certificate /etc/letsencrypt/live/xl-gacha-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xl-gacha-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:XLSSL:1m;
        ssl_session_timeout 10m;
        add_header X-Content-Type-Options nosniff always;
        location = /gacha-config-test/current.json {
            alias /home/admin/xl_updata_server-test/data/gacha_config/current.json;
            default_type application/json;
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            limit_except GET { deny all; }
        }
        location ~ "^/gacha-config-test/(catalog-[1-9][0-9]{0,19}\.json)$" {
            alias /home/admin/xl_updata_server-test/data/gacha_config/$1;
            default_type application/json;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            limit_except GET { deny all; }
        }
        location = /gacha-config/current.json {
            alias /home/admin/xl_updata_server/data/gacha_config/current.json;
            default_type application/json;
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            limit_except GET { deny all; }
        }
        location ~ "^/gacha-config/(catalog-[1-9][0-9]{0,19}\.json)$" {
            alias /home/admin/xl_updata_server/data/gacha_config/$1;
            default_type application/json;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            limit_except GET { deny all; }
        }
        location / { return 404; }
    }
}

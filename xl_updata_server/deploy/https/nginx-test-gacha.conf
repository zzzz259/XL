server {
    listen 127.0.0.1:18080;
    server_name _;
    server_tokens off;
    autoindex off;
    gzip off;
    add_header X-Content-Type-Options nosniff always;

    location ~ "^/gacha-config(?:-test)?/current\.json$" {
        alias /home/admin/xl_updata_server-test/data/gacha_config/current.json;
        default_type application/json;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location ~ "^/gacha-config(?:-test)?/((?:catalog|visual-assets)-[1-9][0-9]{0,19}\.json)$" {
        alias /home/admin/xl_updata_server-test/data/gacha_config/$1;
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location ~ "^/gacha-config(?:-test)?/(assets/(?:portraits|account-rect|account)/[0-9a-f]{64}\.(?:webp|png))$" {
        alias /home/admin/xl_updata_server-test/data/gacha_config/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location / { return 404; }
}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
  "tools",
  "refactor_main_window.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# MainWindow 和旧版 AssetBrowser 仍在渐进拆分；新 core、views 和 tests 不使用这些豁免。
"app/ui/main_window.py" = ["E701", "E702", "E722", "E741"]
"app/ui/asset_browser.py" = ["E701", "E702", "E722", "E741"]
